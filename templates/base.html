<html lang="es" data-theme="utd">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.nombre }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.descripcion }}{% endblock %}">
  <link rel="canonical" href="{{ site.url.rstrip('/') }}{{ path }}">

  <script type="module" src="/src/main.js"></script>
</head>
<body class="bg-base-100 text-base-content font-sans antialiased">
  <a href="#contenido" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-50 btn btn-accent">Saltar al contenido</a>
  {% include "partials/header.html" %}

    {% block main %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
</body>
