{# Page heading with breadcrumbs. Expects: titulo, ruta = [(texto, url), ...], intro (optional) #}
<section class="border-b border-base-300 bg-base-200/60">
  <div class="mx-auto max-w-7xl px-4 py-12">
    <nav aria-label="Ruta" class="breadcrumbs text-sm">
      <ul>
        <li><a href="/">Inicio</a></li>
        {% for texto, enlace in ruta %}<li>{% if enlace %}<a href="{{ enlace }}">{{ texto }}</a>{% else %}{{ texto }}{% endif %}</li>{% endfor %}
      </ul>
    </nav>
    <h1 class="mt-3 max-w-4xl text-4xl font-extrabold md:text-5xl">{{ titulo }}</h1>
    {% if intro %}<p class="mt-4 max-w-3xl text-xl text-base-content/75">{{ intro }}</p>{% endif %}
  </div>
</section>
