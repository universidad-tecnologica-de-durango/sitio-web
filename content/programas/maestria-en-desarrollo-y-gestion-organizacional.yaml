proposito: El Maestro(a) en Desarrollo y Gestión Organizacional cuenta con las competencias profesionales
  necesarias para su desempeño en el campo laboral dentro de las áreas estratégicas de las organizaciones
  para optimizar la administración eficiente de recursos y procesos, fomentando el uso tecnológico y la
  adaptación a entornos cambiantes para mejorar el desempeño y sostenibilidad de las organizaciones.
